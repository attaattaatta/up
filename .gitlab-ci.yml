stages:
  - verify
  - build
  - release

variables:
  APP_NAME: "up"
  GO_VERSION: "1.21"
  CGO_ENABLED: "0"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"

default:
  image: "golang:${GO_VERSION}-alpine"
  before_script:
    - apk add --no-cache ca-certificates git
    - mkdir -p "$GOCACHE" dist
    - go version
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .cache/go-build/

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

verify:
  stage: verify
  script:
    - test -z "$(gofmt -l server/upserv.go)"
    - GOOS=linux GOARCH=amd64 go build -o /tmp/up-smoke ./server/upserv.go
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

build:linux:
  stage: build
  script:
    - GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o "dist/${APP_NAME}" ./server/upserv.go
  artifacts:
    name: "${CI_PROJECT_NAME}-${CI_COMMIT_REF_SLUG}-linux"
    paths:
      - dist/up
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

build:windows:
  stage: build
  script:
    - GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o "dist/${APP_NAME}.exe" ./server/upserv.go
  artifacts:
    name: "${CI_PROJECT_NAME}-${CI_COMMIT_REF_SLUG}-windows"
    paths:
      - dist/up.exe
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

release:package:
  stage: release
  image: alpine:3.20
  needs:
    - job: build:linux
      artifacts: true
    - job: build:windows
      artifacts: true
  before_script:
    - apk add --no-cache curl
  script:
    - export PACKAGE_BASE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${APP_NAME}/${CI_COMMIT_TAG}"
    - curl --fail --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "dist/${APP_NAME}" "${PACKAGE_BASE_URL}/${APP_NAME}"
    - curl --fail --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "dist/${APP_NAME}.exe" "${PACKAGE_BASE_URL}/${APP_NAME}.exe"
    - printf "PACKAGE_BASE_URL=%s\n" "${PACKAGE_BASE_URL}" > release.env
  artifacts:
    reports:
      dotenv: release.env
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.+$/'

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: release:package
      artifacts: true
  script:
    - echo "Creating GitLab release for ${CI_COMMIT_TAG}"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: "Automated release for $CI_COMMIT_TAG. Full release notes are tracked in CHANGELOG.md."
    assets:
      links:
        - name: "up"
          url: "${PACKAGE_BASE_URL}/up"
        - name: "up.exe"
          url: "${PACKAGE_BASE_URL}/up.exe"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.+$/'
